name: Kanvas Biosciences
description: >-
  Kanvas Biosciences is a spatial biology company building a microbiome drug
  screening, discovery, and manufacturing platform to accelerate development of
  next-generation live biotherapeutics. Its proprietary High-Phylogenetic-Resolution
  Spatial Mapping (HiPR-Map) platform uses oligonucleotide probes targeting ribosomal
  and messenger RNA to visualize microbial identity and cellular function within
  tissue across all kingdoms of life, illuminating host-microbiome interactions. The
  company advances a microbiome-based immuno-oncology pipeline (lead candidate KAN-001)
  and operates GMP manufacturing. Backed by DCVC. Added to the API Evangelist network
  as a portfolio-company profile; the enrichment pass found no public developer API,
  SDK, or well-known discovery surface.
